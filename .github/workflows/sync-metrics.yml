name: Update Portfolio Records

on:
  workflow_dispatch:
    inputs:
      tasksCompleted:
        description: '완료된 과제 개수 (예: 11 또는 12)'
        required: false
        default: '11'
      attendanceDays:
        description: '출석 일수 (예: 39)'
        required: false
        default: '39'
      ritualDays:
        description: '리추얼 작성 일수 (예: 39)'
        required: false
        default: '39'
      feedbackCount:
        description: '피드백 교환 횟수 (예: 55)'
        required: false
        default: '55'

permissions:
  contents: write

jobs:
  update-records:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update data/records.json via Node script
        run: |
          node -e "
            const fs = require('fs');
            const path = './data/records.json';
            const data = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
            
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            data.lastUpdated = todayStr;
            data.attendance.days = parseInt('${{ inputs.attendanceDays }}') || data.attendance.days;
            data.attendance.totalDays = data.attendance.days;
            data.ritual.days = parseInt('${{ inputs.ritualDays }}') || data.ritual.days;
            data.ritual.endDate = todayStr;
            data.feedback.count = parseInt('${{ inputs.feedbackCount }}') || data.feedback.count;
            data.tasks.completed = parseInt('${{ inputs.tasksCompleted }}') || data.tasks.completed;
            data.tasks.inProgress = (data.tasks.completed < data.tasks.total) ? (data.tasks.completed + 1) : data.tasks.total;
            
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            console.log('Updated records.json successfully:', data);
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/records.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): sync metrics to task ${{ inputs.tasksCompleted }} on $(date +'%Y-%m-%d')" && git push origin master)
